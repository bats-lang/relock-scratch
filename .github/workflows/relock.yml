name: relock
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
jobs:
  relock:
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@d4a7b2366cade5adeacfee80a9720d8f1450dce8 # repository-prototype main d4a7b23
    secrets: inherit
    with:
      base: scratch-344b
      branch-prefix: relock-344b/
      workflow-pins: |
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
      regenerate: |
        sha256sum .github/workflows/relock.yml > derived.txt
        echo unlisted > unlisted.txt
      regenerate-paths: |
        derived.txt

