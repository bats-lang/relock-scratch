# Fixture of bats-lang/repository-prototype#669: the recheck of the pull requests of this repository that are
# red on canonical-files, run by hand with the ref whose allowlist holds the line that was merged.
name: canonical-files-recheck

on:
  workflow_dispatch:
    inputs:
      data-ref:
        description: The ref of repository-prototype whose allowlist and templates are read.
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: read
  checks: read

jobs:
  recheck:
    uses: bats-lang/repository-prototype/.github/workflows/canonical-files-recheck.yml@5bfbedc9ce729eb0e8fe79cfe47d77fe51a5811a # repository-prototype main 5bfbedc
    with:
      tools-ref: 5bfbedc9ce729eb0e8fe79cfe47d77fe51a5811a
      data-ref: ${{ inputs.data-ref }}
      repository: bats-lang/relock-scratch
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
