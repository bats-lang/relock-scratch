# The check the relock pull request runs (repository-prototype#414). It uses an
# outdated actions/checkout pin on purpose: the relock moves it.
name: check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git log -1 --format=%H
