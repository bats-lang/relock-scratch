# Fixture of bats-lang/repository-prototype#669: the recheck of the pull requests of this repository that are
# red on canonical-files, run by hand with the ref whose allowlist holds the line that was merged.
name: canonical-files-recheck

on:
  workflow_dispatch:
    inputs:
      data-ref:
        description: The ref of repository-prototype whose allowlist and templates are read.
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: read
  checks: read

jobs:
  recheck:
    uses: bats-lang/repository-prototype/.github/workflows/canonical-files-recheck.yml@aa889a50927644e55e1e6f56c90d6e00c2b40935 # repository-prototype main aa889a5
    with:
      tools-ref: aa889a50927644e55e1e6f56c90d6e00c2b40935
      data-ref: ${{ inputs.data-ref }}
      repository: bats-lang/relock-scratch
    secrets:
      token: ${{ github.token }}
