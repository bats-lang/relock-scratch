# Publishes this package to bats-lang/repository-prototype when src/ or
# bats.toml changes on main. See PUBLISHING-SETUP.md there. Called by
# commit, which the daily relock moves (bats-lang/repository-prototype#269).
name: publish-282
on:
  push:
    branches: [pwa-282-never]
    paths: ['src/**', 'bats.toml']
jobs:
  publish:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@7d67e8b7d4a4080a1c992729c062621929538400 # repository-prototype main 7d67e8b
    secrets: inherit
