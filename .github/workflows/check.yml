name: check

on:
  push:
    branches: [main]
  # A draft pull request runs no job (package-check.yml, keyword: draft-ci), so
  # marking it ready must start the check: ready_for_review is added to the
  # default types
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    uses: bats-lang/repository-prototype/.github/workflows/package-check.yml@803b4fb2635580d0f4ee8ac0fb69ccbd8502abbe # repository-prototype draft-ci-525 803b4fb
