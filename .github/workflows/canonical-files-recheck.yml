# Fixture of bats-lang/repository-prototype#669: this repository plays the part of repository-prototype.
# Its main holds tools/pin-audit/allowlist.txt and the templates (copied from repository-prototype), and the
# push to its main that changes the allowlist or a template rechecks the pull requests of this repository
# that are red on canonical-files, against this repository's own main.
name: canonical-files-recheck

on:
  push:
    branches: [main]
    paths:
      - tools/pin-audit/allowlist.txt
      - tools/pin-audit/templates/**

permissions:
  contents: read
  statuses: write
  pull-requests: read
  checks: read

jobs:
  recheck:
    uses: bats-lang/repository-prototype/.github/workflows/canonical-files-recheck.yml@baeefe62555ba1dcc9762b0a1a947d483f3b0cb9 # repository-prototype main baeefe6
    with:
      tools-ref: baeefe62555ba1dcc9762b0a1a947d483f3b0cb9
      data-repository: bats-lang/relock-scratch
      repository: bats-lang/relock-scratch
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
