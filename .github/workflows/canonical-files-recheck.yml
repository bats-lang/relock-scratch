# Fixture of bats-lang/repository-prototype#669: the recheck of the pull requests of this repository that are
# red on canonical-files, run by hand with the ref whose allowlist holds the line that was merged.
name: canonical-files-recheck

on:
  workflow_dispatch:
    inputs:
      data-ref:
        description: The ref of repository-prototype whose allowlist and templates are read.
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: read
  checks: read

jobs:
  recheck:
    uses: bats-lang/repository-prototype/.github/workflows/canonical-files-recheck.yml@df9bdd5526b4336505bab55bb375e0f4ceea1b33 # repository-prototype main df9bdd5
    with:
      tools-ref: df9bdd5526b4336505bab55bb375e0f4ceea1b33
      data-ref: ${{ inputs.data-ref }}
      repository: bats-lang/relock-scratch
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
